<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="sign.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
</head>
<body>

    <header class="encabezado">
        <img src="/imagenes-pagina-principal/avion.png" alt="avion"><span>my Dream Place</span></img>
    </header>

    <section class="contenedor_formulario">
        <h2>Sign in</h2>

        <form class="formulario">
            
            <label for="email">Email address</label>
            <input type="email" id="email">

            <label for="password">Password</label>
            <div class="grupo-password">
                <input type="password" id="password"> <img src="/imagenes-pagina-principal/ojo.png" alt="ojo"></img>
            </div>

            <div class="opciones">
                <label><input type="checkbox"><span class="texto_opcion">Keep me signed in</span></label>
                <span class="forgotpassword"><a href="forgot.html">Forgot password?</a></span>
            </div>

            <button class="contemail"><a href="principal.html">Continue with email</a></button>

            <div class="textolineal">
                <span></span> or use one of these options <span></span>
            </div>

            <button class="contgoogle">
                <img src="/imagenes-pagina-principal/logogoogle.png" alt="LogoGoogle">Continue with Google</img>
            </button>

            <button class="contfacebook">
                <img src="/imagenes-pagina-principal/facebook.png" alt="LogoFacebook">Continue with Facebook</img>
            </button>

        </form>

        <p class="registrarse">Don’t have an account? <a href="register.html">Register</a></p>
    </section>

</body>
</html>
