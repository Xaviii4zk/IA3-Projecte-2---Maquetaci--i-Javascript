<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot your Password?</title>
    <link rel="stylesheet" href="forgot.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
</head>
<body>
    <header class="encabezado">
        <img src="/imagenes-pagina-principal/avion.png" alt="avion"><span>my Dream Place</span></img>
    </header>

    <section class="contenedor_formulario">
        <h2>Forgot your password?</h2>
        <p>We’ll send you a link to reset it. Enter your email address used for My Dream Place</p>

        <form class="formulario">
            
            <label for="email">Your email address</label>
            <div class="grupo-email">
                <input type="email" id="email">
            </div>

            <button class="restablecer"><a href="inbox.html">Send Reset Link</a></button>

        </form>

    </section>

    <div class="centrarizquierda">
        <div class="terminos">
            By creating an account, you agree with our
            <span> Terms and Conditions</span>
            and
            <span>Privacy Statement.</span>
        </div>
    </div>

</body>
</html>
