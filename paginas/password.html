<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password</title>
    <link rel="stylesheet" href="password.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
</head>
<body>
    <header class="encabezado">
        <img src="/imagenes-pagina-principal/avion.png" alt="avion"><span>my Dream Place</span></img>
    </header>

    <section class="contenedor_formulario">
        <h2>Create password</h2>
        <p>Use a minimum of 10 characters, including letters, lowercase letters, and numbers.</p>

        <form class="formulario">
            
            <label for="password">Password</label>
            <div class="grupo-password1">
                <input type="password" id="password">
                <img src="/imagenes-pagina-principal/ojo.png" alt="ojo">
            </div>
            <label for="password">Confirm Password</label>
            <div class="grupo-password2">
                <input type="password" id="password"> <img src="/imagenes-pagina-principal/ojo.png" alt="ojo"></img>
            </div>

            <button class="crearcuenta"><a href="principal.html">Create account</a></button>

        </form>

    </section>

    <div class="centrarizquierda">
        <div class="terminos">
            <p>By creating an account, you agree with our
            <span> Terms and Conditions</span>
            and
            <span>Privacy Statement.</span></p>
        </div>
    </div>

</body>
</html>
