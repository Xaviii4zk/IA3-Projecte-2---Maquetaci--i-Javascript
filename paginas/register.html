<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <header class="encabezado">
        <img src="/imagenes-pagina-principal/avion.png" alt="avion"><span>my Dream Place</span></img>
    </header>

    <section class="contenedor_formulario">
        <h2>Register</h2>

        <form class="formulario">
            <div class="grupo_email">
                <label for="email">Email address</label>
                <input type="email" id="email" class="regis_email">
            </div>

            <button class="contemail"><a href="password.html">Continue with email</a></button>

            <div class="textolineal">
                <span></span> or use one of these options <span></span>
            </div>

            <button class="contgoogle">
                <img src="/imagenes-pagina-principal/logogoogle.png" alt="LogoGoogle">Continue with Google</img>
            </button>

            <button class="contfacebook">
                <img src="/imagenes-pagina-principal/facebook.png" alt="LogoFacebook">Continue with Facebook</img>
            </button>

        </form>

        <p class="tienescuenta">Already have an account?<a href="sign.html"> Sign in</a></p>
    </section>

</body>
</html>

</body>
</html>
